async function getJson(url, headers = {}) {

// ---- ログイン (Cognito Hosted UI + Google、PKCE 付き認可コード) ----
const AUTH = { cfg: { login_enabled: false }, token: null, email: null };
const authHeaders = () => (AUTH.token ? { authorization: `Bearer ${AUTH.token}` } : {});

const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

async function login() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  sessionStorage.setItem("pkce_verifier", verifier);
  const challenge = b64url(
    await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const u = new URL(`https://${AUTH.cfg.cognito_domain}/oauth2/authorize`);
  u.search = new URLSearchParams({
    client_id: AUTH.cfg.client_id, response_type: "code", scope: "openid email",
    redirect_uri: location.origin + "/", identity_provider: "Google",
    code_challenge_method: "S256", code_challenge: challenge,
  });
  location.href = u;
}

async function exchangeCode(code) {
  const r = await fetch(`https://${AUTH.cfg.cognito_domain}/oauth2/token`, {
    method: "POST",
    headers: { "content-type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({
      grant_type: "authorization_code", client_id: AUTH.cfg.client_id,
      code, redirect_uri: location.origin + "/",
      code_verifier: sessionStorage.getItem("pkce_verifier") || "",
    }),
  });
  sessionStorage.removeItem("pkce_verifier");
  const data = await r.json();
  if (!data.id_token) throw new Error(data.error || T("login_failed"));
  localStorage.setItem("id_token", data.id_token);
  localStorage.setItem("id_token_exp",
    String(Date.now() + (data.expires_in || 3600) * 1000));
}

function loadToken() {
  const tok = localStorage.getItem("id_token");
  const exp = Number(localStorage.getItem("id_token_exp") || 0);
  if (!tok || Date.now() > exp - 60000) return;
  try {
    const claims = JSON.parse(
      atob(tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    AUTH.token = tok;
    AUTH.email = claims.email || "";
  } catch { /* 壊れたトークンは無視 */ }
}

function logout() {
  localStorage.removeItem("id_token");
  localStorage.removeItem("id_token_exp");
  AUTH.token = null; AUTH.email = null;
  renderUserbar(); selectTab(lang === "en" ? "upload" : "repo");
}

function renderUserbar() {
  const bar = $("userbar");
  $("tab-my").classList.toggle("hidden", !AUTH.token);
  $("saved-note").classList.toggle("hidden", !AUTH.token);
  $("upload-policy").textContent =
    AUTH.token ? T("policy_authed") : T("policy_anon");
  if (AUTH.token) {
    bar.innerHTML = `${T("loggedin_as", esc(AUTH.email))}
      <button id="btn-logout">${T("btn_logout")}</button>`;
    $("btn-logout").onclick = logout;
    loadSavedZipSelectors();
  } else if (AUTH.cfg.login_enabled) {
    bar.innerHTML = `<button id="btn-login">${T("btn_login")}</button>
      <br><span class="note">${T("login_benefit")}</span>`;
    $("btn-login").onclick = login;
  } else {
    bar.innerHTML = "";
  }
}

async function initAuth() {
  try { AUTH.cfg = await getJson("/api/config"); } catch { /* ログインなし運用 */ }
  const params = new URLSearchParams(location.search);
  if (params.get("code") && sessionStorage.getItem("pkce_verifier")) {
    try { await exchangeCode(params.get("code")); }
    catch (e) { showStatus(T("login_error", esc(e.message)), true); }
    history.replaceState(null, "", location.pathname);
  }
  loadToken();
  renderUserbar();
}

// XL5: 匿名利用でも結果 URL を見失わないための localStorage 履歴と再開 URL。

const ANON_HIST_KEY = "anon_history";
const anonHist = () => {
  try { return JSON.parse(localStorage.getItem(ANON_HIST_KEY) || "[]"); }
  catch { return []; }
};
function anonHistUpsert(entry) {
  if (AUTH.token) return;
  try {
    const items = anonHist().filter((x) => x.job_id !== entry.job_id);
    items.unshift(entry);
    localStorage.setItem(ANON_HIST_KEY, JSON.stringify(items.slice(0, 20)));
  } catch { /* localStorage 不可 (プライベートモード等) でも比較は続行 */ }
  renderAnonHist();
}
function renderAnonHist() {
  const items = AUTH.token ? [] : anonHist();
  $("anon-hist").classList.toggle("hidden", !items.length);
  if (!items.length) return;
  $("anon-hist-box").innerHTML = "<table><tbody>" + items.map((it) => {

let runningJobs = 0;  // 実行中はタブを閉じる前にブラウザの確認を出す

const resumeLine = (jobId) => {
  const url = `${location.origin}${location.pathname}?job=${encodeURIComponent(jobId)}`;
  return `<br><span class="note">${T("resume_note")} <a href="${esc(url)}">${esc(url)}</a> ` +
    `<button class="small" type="button" data-copy="${esc(url)}">${T("copy_url")}</button></span>`;

function jobDisplayName(body) {
  if (body.type === "upload")
    return [body.old_name || T("old_zip"), body.new_name || T("new_zip")].join(" ⇔ ");
  const name = [body.org_name, body.feed_name].filter(Boolean).join(" — ")
    || `${body.org || ""}/${body.feed || ""}`;
  return (body.old_from_date || body.new_from_date)
    ? `${name} ${body.old_from_date || "?"} → ${body.new_from_date || "?"}` : name;
}

async function pollJob(jobId, statusUrl, name) {
  const started = Date.now();
  runningJobs++;
  try {
    while (true) {
      await new Promise((ok) => setTimeout(ok, 3000));
      const st = await getJson(statusUrl);
      const sec = Math.round((Date.now() - started) / 1000);
      if (st.status === "succeeded") {
        showStatus(`${T("done", st.result_url)}<br><span class="note">${T("share_note")}</span>`);
        anonHistUpsert({ job_id: jobId, created_at: new Date().toISOString(),
                         name, status: "succeeded", result_url: st.result_url });
        return;
      }
      if (st.status === "failed") {
        // error_kind: input = 入力 GTFS データ起因 (再試行しても結果は同じ)
        const hint = st.error_kind === "input"
          ? `<br><span class="note">${T("fail_input_hint")}</span>` : "";
        showStatus(`<strong>${T("fail_head")}</strong><br>` +
          `${esc(apiError(st, "") || T("fail_fallback"))}${hint}`, true);
        anonHistUpsert({ job_id: jobId, created_at: new Date().toISOString(),
                         name, status: "failed" });
        return;
      }
      showStatus(T("computing", sec) + resumeLine(jobId));
    }
  } finally { runningJobs--; }
}

async function submitAndPoll(body) {
  showStatus(T("submitting"));
  const endpoint = AUTH.token ? "/api/me/jobs" : "/api/jobs";
  const r = await fetch(endpoint, {
    method: "POST",
    headers: { "content-type": "application/json", ...authHeaders() },
    body: JSON.stringify(body),
  });
  const job = await r.json();
  if (!r.ok) throw new Error(apiError(job, r.status));
  const name = jobDisplayName(body);
  if (job.status === "succeeded" && job.result_url) {
    showStatus(`${T("cached", job.result_url)}<br><span class="note">${T("share_note")}</span>`);
    anonHistUpsert({ job_id: job.job_id, created_at: new Date().toISOString(),
                     name, status: "succeeded", result_url: job.result_url });
    return;
  }
  anonHistUpsert({ job_id: job.job_id, created_at: new Date().toISOString(),
                   name, status: "running" });
  showStatus(T("computing", 0) + resumeLine(job.job_id));
  await pollJob(job.job_id, job.status_url, name);
}

function repoBody(org, feed, oldUid, newUid, extra = {}) {

async function uploadTo(post, file) {
  const form = new FormData();
  for (const [k, v] of Object.entries(post.fields)) form.append(k, v);
  form.append("file", file);
  const r = await fetch(post.url, { method: "POST", body: form });
  if (!r.ok) throw new Error(T("upload_fail", r.status));
}

$("run-upload").onclick = async () => {
  $("run-upload").disabled = true;
  try {
    const body = { type: "upload" };
    const needUpload = [];
    for (const side of ["old", "new"]) {
      const zipId = $(`saved-${side}`).value;
      if (zipId) { body[`${side}_zip_id`] = zipId; }
      else { needUpload.push(side); }
    }
    if (needUpload.length) {
      showStatus(T("geturl"));
      const r = await fetch("/api/uploads", { method: "POST" });
      const data = await r.json();
      if (!r.ok) throw new Error(apiError(data, r.status));
      for (const side of needUpload) {
        const file = $(`file-${side}`).files[0];
        if (file.size > data.max_bytes)
          throw new Error(T("too_big"));
        showStatus(T("uploading", side));
        await uploadTo(data.uploads[side], file);
        body[`${side}_key`] = data.uploads[side].key;
        body[`${side}_name`] = file.name;
      }
    }
    await submitAndPoll(body);
    loadSavedZipSelectors();  // 新規保存分をプルダウンへ反映
  } catch (e) { showStatus(T("err", esc(e.message)), true); }
  finally { updateUploadButton(); }
};

// ---- マイページ (履歴・再比較・保存 zip) ----
let histItems = [];

function histLabel(it) {
  if (it.kind === "repo") {
    const name = [it.org_name, it.feed_name].filter(Boolean).join(" — ")
      || `${it.org || ""}/${it.feed || ""}`;
    const gens = (it.old_from_date || it.new_from_date)
      ? `${it.old_from_date || "?"} → ${it.new_from_date || "?"}` : "";
    return { name, gens };
  }
  const name = [
    histSideLabel(it.old_label, it.old_label_parts, it.old_name || T("old_zip")),
    histSideLabel(it.new_label, it.new_label_parts, it.new_name || T("new_zip")),
  ].join(" ⇔ ");
  return { name: T("upload_label", name), gens: "" };
}

function sortHist(items, mode) {
  const arr = [...items];
  if (mode === "operator")
    arr.sort((a, b) => histLabel(a).name.localeCompare(histLabel(b).name, lang));
  else if (mode === "gen")
    arr.sort((a, b) => (b.new_from_date || "").localeCompare(a.new_from_date || ""));
  else arr.sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
  return arr;
}

function renderHistory() {
  const box = $("hist-box");
  if (!histItems.length) {
    box.innerHTML = `<p class='note'>${T("hist_empty")}</p>`;
    return;
  }
  const sorted = sortHist(histItems, $("hist-sort").value);
  const rows = sorted.map((it, i) => {
    const { name, gens } = histLabel(it);
    const date = jdate(it.created_at);
    const acts = [`<a href="${esc(it.result_url)}">${T("open")}</a>`];
    if (it.kind === "repo" && it.old_uid && it.new_uid) {
      acts.push(`<button class="small" data-re="${i}">${T("re_same")}</button>`);
      acts.push(`<button class="small" data-latest="${i}">${T("re_latest")}</button>`);
    }
    acts.push(`<button class="small" data-del="${i}">${T("del")}</button>`);
    return `<tr><td>${esc(date)}</td><td>${esc(name)}` +
      (gens ? `<br><span class="note">${esc(gens)}</span>` : "") +
      `</td><td>${acts.join(" ")}</td></tr>`;
  });
  box.innerHTML = `<table class="hist"><tr><th>${T("th_date")}</th><th>${T("th_target")}</th><th></th></tr>` +
    rows.join("") + `</table>` +
    `<p class="note">${T("latest_note")}</p>`;
  box.querySelectorAll("button[data-re]").forEach((b) => {
    b.onclick = () => recompare(sorted[Number(b.dataset.re)], false);
  });
  box.querySelectorAll("button[data-latest]").forEach((b) => {
    b.onclick = () => recompare(sorted[Number(b.dataset.latest)], true);
  });
  box.querySelectorAll("button[data-del]").forEach((b) => {
    b.onclick = () => deleteHistory(sorted[Number(b.dataset.del)]);
  });
}

async function deleteZip(z) {

async function recompare(it, useLatest) {
  try {
    let newUid = it.new_uid, newFrom = it.new_from_date || "";
    if (useLatest) {
      showStatus(T("checking_latest"));
      const data = await getJson(`/api/gtfs/files?org=${it.org}&feed=${it.feed}`);
      const latest = data.files[0];
      if (!latest || !latest.uid) throw new Error(T("no_latest"));
      newUid = latest.uid; newFrom = latest.from_date || "";
      const same = latest.uid === it.new_uid ? T("still_latest") : "";
      showStatus(T("recompare_note", esc(it.old_from_date || "?"),
        esc(newFrom || "?"), same));
    }
    await submitAndPoll(repoBody(it.org, it.feed, it.old_uid, newUid, {
      org_name: it.org_name || "", feed_name: it.feed_name || "",
      old_from_date: it.old_from_date || "", new_from_date: newFrom,
    }));
    loadMyPage();
  } catch (e) { showStatus(T("err", esc(e.message)), true); }
}

function renderZips() {
  const box = $("zips-box");
  if (!savedZips.length) {
    box.innerHTML = `<p class='note'>${T("zips_empty")}</p>`;
    return;
  }
  const mb = (n) => (Number(n || 0) / 1048576).toFixed(1);
  box.innerHTML = `<table class="hist"><tr><th>${T("th_name")}</th><th>${T("th_size")}</th><th>${T("th_saved")}</th><th></th></tr>` +
    savedZips.map((z, i) =>
      `<tr><td>${esc(zipName(z))}</td><td>${mb(z.size)} MB</td>` +
      `<td>${esc(jdate(z.created_at))}</td>` +
      `<td><button class="small" data-zdel="${i}">${T("del")}</button></td></tr>`).join("") +
    `</table><p class="note">${T("zip_reuse")}</p>`;
  box.querySelectorAll("button[data-zdel]").forEach((b) => {
    b.onclick = () => deleteZip(savedZips[Number(b.dataset.zdel)]);
  });
}

async function loadMyPage() {
  if (!AUTH.token) return;
  try {
    const [hist] = await Promise.all([
      getJson("/api/me/history", authHeaders()),
      loadSavedZipSelectors(),
    ]);
    histItems = hist.items;
    renderHistory();
    renderZips();
  } catch (e) {
    $("hist-box").innerHTML = `<p class='note'>${T("my_fail", esc(e.message))}</p>`;
  }
}
$("hist-sort").onchange = renderHistory;

applyLang();
if (lang === "en") selectTab("upload");  // en の既定はアップロード (i18n.md I2)
initAuth();

// XL5: 再開 URL (?job=...) — 実行中に閉じたページから結果へ戻る導線
const resumeId = new URLSearchParams(location.search).get("job");
if (resumeId && /^[A-Za-z0-9_-]{1,64}$/.test(resumeId)) {
  const known = anonHist().find((x) => x.job_id === resumeId);
  showStatus(T("computing", 0));
  pollJob(resumeId, `/api/jobs/${encodeURIComponent(resumeId)}`,
          (known && known.name) || resumeId)
    .catch((e) => showStatus(T("err", esc(e.message)), true));
}
</script>
</body>
</html>
