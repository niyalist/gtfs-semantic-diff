[project]
name = "gtfs-semantic-diff"
version = "2026.9.17.1"
description = "Semantic diff extraction for multi-generation GTFS feeds"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "click>=8.0",
    "requests>=2.28",
    "rich>=13.0",
]

[project.optional-dependencies]
# mcp は MCP サーバーの contract test 用 — バージョン指定は実行環境
# (infra/runtime/Dockerfile の "mcp~=2.0") と揃えて更新すること
dev = ["pytest>=8.0", "ruff", "mypy", "mcp~=2.0", "httpx"]

[project.scripts]
gtfs-semantic-diff = "gtfs_semantic_diff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_semantic_diff"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
