[project]
name = "gtfs-semantic-diff"
version = "2026.9.17.1"
description = "Semantic diff extraction for multi-generation GTFS feeds"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "click>=8.0",
    "requests>=2.28",
    "rich>=13.0",
]

[project.optional-dependencies]
# mcp は MCP サーバーの contract test 用 — バージョン指定は実行環境
# (infra/runtime/Dockerfile の "mcp~=2.0") と揃えて更新すること
dev = ["pytest>=8.0", "ruff", "mypy", "mcp~=2.0", "httpx"]

[project.scripts]
gtfs-semantic-diff = "gtfs_semantic_diff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_semantic_diff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 規則セットを明示して ruff のバージョン差で結果が揺れないようにする
# (0.16 系でデフォルト規則が拡張され、新規環境で 54 件出た — 2026-09-18)。
# 新規則の採用はコード変更を伴うため、やるなら独立タスクとして
# 出力不変 (pytest + 検証フィード) を確認しつつ行うこと
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
